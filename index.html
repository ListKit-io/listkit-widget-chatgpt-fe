    <title>Universal MCP Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"

    />

  <body
    style="margin: 0; padding: 0; font-family: &quot;DM Sans&quot;, sans-serif"
  >
    <div id="root"></div>

    <script type="module">
      console.log("module fe initialized");
      const checkAndRender = () => {
        const data = window.openai?.toolOutput || window.lastMcpData;
        const theme = window.openai?.theme || "light";

        if (window.renderWidget && data) {
          window.renderWidget("index_fallback", data, theme);
          return true;
        }
        return false;
      };

      let attempts = 0;
      const initInterval = setInterval(() => {
        attempts++;
        if (checkAndRender() || attempts > 20) {
          clearInterval(initInterval);
        }
      }, 100);
    </script>
